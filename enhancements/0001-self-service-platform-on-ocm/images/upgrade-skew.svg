<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="310" viewBox="0 0 1160 310" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Upgrades: a platform tag moves to non-production first, then to production with Operator approval; exports use the schema production runs</title>
  <defs><marker id="a_2F6FB0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6FB0"/></marker><marker id="a_C62828" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C62828"/></marker></defs>
  <rect x="0" y="0" width="1160" height="310" fill="#FFFFFF"/>
  <rect x="20.0" y="30.0" width="200.0" height="70.0" rx="8" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5"/>
  <text x="120.0" y="61.5" font-size="13" fill="#A33A00" text-anchor="middle" font-weight="600">Tag platform v1.5</text>
  <text x="120.0" y="77.5" font-size="10" fill="#455A64" text-anchor="middle">SSP + templates</text>
  <rect x="248.0" y="30.0" width="200.0" height="70.0" rx="8" fill="#EEF4FB" stroke="#2F6FB0" stroke-width="1.5"/>
  <text x="348.0" y="54.5" font-size="13" fill="#1F4F82" text-anchor="middle" font-weight="600">fleet-np bump</text>
  <text x="348.0" y="70.5" font-size="10" fill="#455A64" text-anchor="middle">np-hub upgrades</text>
  <text x="348.0" y="84.5" font-size="10" fill="#455A64" text-anchor="middle">re-renders on change</text>
  <path d="M220.0,65.0 L248.0,65.0" fill="none" stroke="#2F6FB0" stroke-width="1.6" marker-end="url(#a_2F6FB0)"/>
  <rect x="476.0" y="30.0" width="200.0" height="70.0" rx="8" fill="#EEF4FB" stroke="#2F6FB0" stroke-width="1.5"/>
  <text x="576.0" y="61.5" font-size="13" fill="#1F4F82" text-anchor="middle" font-weight="600">Soak in dv, te</text>
  <text x="576.0" y="77.5" font-size="10" fill="#455A64" text-anchor="middle">health, alerts</text>
  <path d="M448.0,65.0 L476.0,65.0" fill="none" stroke="#2F6FB0" stroke-width="1.6" marker-end="url(#a_2F6FB0)"/>
  <rect x="704.0" y="30.0" width="200.0" height="70.0" rx="8" fill="#FDECEA" stroke="#C62828" stroke-width="1.5"/>
  <text x="804.0" y="61.5" font-size="13" fill="#8E1B1B" text-anchor="middle" font-weight="600">fleet-pr bump PR</text>
  <text x="804.0" y="77.5" font-size="10" fill="#455A64" text-anchor="middle">Operator approval</text>
  <path d="M676.0,65.0 L704.0,65.0" fill="none" stroke="#C62828" stroke-width="1.6" marker-end="url(#a_C62828)"/>
  <rect x="932.0" y="30.0" width="200.0" height="70.0" rx="8" fill="#FDECEA" stroke="#C62828" stroke-width="1.5"/>
  <text x="1032.0" y="61.5" font-size="13" fill="#8E1B1B" text-anchor="middle" font-weight="600">pr-hub upgrades</text>
  <text x="1032.0" y="77.5" font-size="10" fill="#455A64" text-anchor="middle">v1.5 in production</text>
  <path d="M904.0,65.0 L932.0,65.0" fill="none" stroke="#C62828" stroke-width="1.6" marker-end="url(#a_C62828)"/>
  <rect x="20.0" y="140.0" width="540.0" height="150.0" rx="10" fill="#F3F0FA" stroke="#6B4FA8" stroke-width="1.5"/>
  <text x="36.0" y="164.0" font-size="13" fill="#4A3480" text-anchor="start" font-weight="600">Releases pin their templates</text>
  <text x="36.0" y="190.0" font-size="12" fill="#263238" text-anchor="start">• A ComponentRelease records its type and trait versions.</text>
  <text x="36.0" y="214.0" font-size="12" fill="#263238" text-anchor="start">• A new template version never changes a running release.</text>
  <text x="36.0" y="238.0" font-size="12" fill="#263238" text-anchor="start">• Teams pick it up when they create a new release.</text>
  <text x="36.0" y="262.0" font-size="12" fill="#263238" text-anchor="start">• Rendered bundles carry the SSP version as a label.</text>
  <rect x="600.0" y="140.0" width="540.0" height="150.0" rx="10" fill="#FDECEA" stroke="#C62828" stroke-width="1.5"/>
  <text x="616.0" y="164.0" font-size="13" fill="#8E1B1B" text-anchor="start" font-weight="600">Skew between the stacks</text>
  <text x="616.0" y="190.0" font-size="12" fill="#263238" text-anchor="start">• np may run a newer SSP than pr while it soaks.</text>
  <text x="616.0" y="214.0" font-size="12" fill="#263238" text-anchor="start">• fleet-pr records the SSP version production runs.</text>
  <text x="616.0" y="238.0" font-size="12" fill="#263238" text-anchor="start">• release export writes that schema version, so pr</text>
  <text x="616.0" y="262.0" font-size="12" fill="#263238" text-anchor="start">   always understands what it is asked to apply.</text>
</svg>
