<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="390" viewBox="0 0 1120 390" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Managed resources: a Resource renders a cloud claim through ManifestWork; non-secret outputs and passwordless sign-in reach the workload; the binding waits until ready</title>
  <defs><marker id="a_2E7D32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="a_6B4FA8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B4FA8"/></marker><marker id="a_00838F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00838F"/></marker><marker id="a_0078D4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0078D4"/></marker><marker id="a_AD1457" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#AD1457"/></marker></defs>
  <rect x="0" y="0" width="1120" height="390" fill="#FFFFFF"/>
  <rect x="20.0" y="40.0" width="150.0" height="66.0" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="95.0" y="62.0" font-size="12" fill="#1B5E20" text-anchor="middle" font-weight="600">Resource</text>
  <text x="95.0" y="78.0" font-size="10" fill="#455A64" text-anchor="middle">type: postgres</text>
  <text x="95.0" y="92.0" font-size="10" fill="#455A64" text-anchor="middle">app-checkout</text>
  <rect x="200.0" y="40.0" width="170.0" height="66.0" rx="8" fill="#F3F0FA" stroke="#6B4FA8" stroke-width="1.5"/>
  <text x="285.0" y="62.0" font-size="12" fill="#4A3480" text-anchor="middle" font-weight="600">ClusterResourceType</text>
  <text x="285.0" y="78.0" font-size="10" fill="#455A64" text-anchor="middle">templates · readyWhen</text>
  <text x="285.0" y="92.0" font-size="10" fill="#455A64" text-anchor="middle">outputs</text>
  <rect x="400.0" y="40.0" width="150.0" height="66.0" rx="8" fill="#E0F2F1" stroke="#00838F" stroke-width="1.5"/>
  <text x="475.0" y="69.0" font-size="12" fill="#00695C" text-anchor="middle" font-weight="600">ManifestWork</text>
  <text x="475.0" y="85.0" font-size="10" fill="#455A64" text-anchor="middle">to the target cluster</text>
  <rect x="580.0" y="40.0" width="160.0" height="66.0" rx="8" fill="#E5F1FB" stroke="#0078D4" stroke-width="1.5"/>
  <text x="660.0" y="69.0" font-size="12" fill="#005A9E" text-anchor="middle" font-weight="600">ASO / Crossplane</text>
  <text x="660.0" y="85.0" font-size="10" fill="#455A64" text-anchor="middle">claim on the cluster</text>
  <rect x="770.0" y="40.0" width="160.0" height="66.0" rx="8" fill="#E5F1FB" stroke="#0078D4" stroke-width="1.5"/>
  <text x="850.0" y="62.0" font-size="12" fill="#005A9E" text-anchor="middle" font-weight="600">Azure resource</text>
  <text x="850.0" y="78.0" font-size="10" fill="#455A64" text-anchor="middle">e.g. PostgreSQL</text>
  <text x="850.0" y="92.0" font-size="10" fill="#455A64" text-anchor="middle">flexible server</text>
  <path d="M170.0,73.0 L200.0,73.0" fill="none" stroke="#2E7D32" stroke-width="1.6" marker-end="url(#a_2E7D32)"/>
  <path d="M370.0,73.0 L400.0,73.0" fill="none" stroke="#6B4FA8" stroke-width="1.6" marker-end="url(#a_6B4FA8)"/>
  <path d="M550.0,73.0 L580.0,73.0" fill="none" stroke="#00838F" stroke-width="1.6" marker-end="url(#a_00838F)"/>
  <path d="M740.0,73.0 L770.0,73.0" fill="none" stroke="#0078D4" stroke-width="1.6" marker-end="url(#a_0078D4)"/>
  <rect x="960.0" y="150.0" width="150.0" height="66.0" rx="8" fill="#E5F1FB" stroke="#0078D4" stroke-width="1.5"/>
  <text x="1035.0" y="172.0" font-size="12" fill="#005A9E" text-anchor="middle" font-weight="600">Outputs</text>
  <text x="1035.0" y="188.0" font-size="10" fill="#455A64" text-anchor="middle">host · port · database</text>
  <text x="1035.0" y="202.0" font-size="10" fill="#455A64" text-anchor="middle">→ ConfigMap</text>
  <rect x="960.0" y="250.0" width="150.0" height="66.0" rx="8" fill="#FCE4EC" stroke="#AD1457" stroke-width="1.5"/>
  <text x="1035.0" y="272.0" font-size="12" fill="#880E4F" text-anchor="middle" font-weight="600">Sign-in</text>
  <text x="1035.0" y="288.0" font-size="10" fill="#455A64" text-anchor="middle">Entra workload identity</text>
  <text x="1035.0" y="302.0" font-size="10" fill="#455A64" text-anchor="middle">(passwordless)</text>
  <path d="M850.0,106.0 L850.0,183.0 L960.0,183.0" fill="none" stroke="#0078D4" stroke-width="1.6" marker-end="url(#a_0078D4)"/>
  <rect x="680.0" y="240.0" width="200.0" height="76.0" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="780.0" y="267.0" font-size="12" fill="#1B5E20" text-anchor="middle" font-weight="600">Pod</text>
  <text x="780.0" y="283.0" font-size="10" fill="#455A64" text-anchor="middle">environment from outputs</text>
  <text x="780.0" y="297.0" font-size="10" fill="#455A64" text-anchor="middle">token from its own identity</text>
  <path d="M960.0,290.0 L880.0,290.0" fill="none" stroke="#AD1457" stroke-width="1.6" marker-end="url(#a_AD1457)"/>
  <path d="M1035.0,216.0 L1035.0,232.0 L920.0,232.0 L920.0,258.0 L880.0,258.0" fill="none" stroke="#0078D4" stroke-width="1.6" marker-end="url(#a_0078D4)"/>
  <text x="560.0" y="356.0" font-size="11" fill="#455A64" text-anchor="middle" font-style="italic">No Kubernetes Secret holds a credential (SR-5). If a service cannot sign in with Entra ID, the resource type keeps</text>
  <text x="560.0" y="372.0" font-size="11" fill="#455A64" text-anchor="middle" font-style="italic">its password in Key Vault, and the Secrets Store CSI driver mounts it into the pod.</text>
  <rect x="200.0" y="160.0" width="170.0" height="66.0" rx="8" fill="#E0F2F1" stroke="#00838F" stroke-width="1.5"/>
  <text x="285.0" y="182.0" font-size="12" fill="#00695C" text-anchor="middle" font-weight="600">readyWhen</text>
  <text x="285.0" y="198.0" font-size="10" fill="#455A64" text-anchor="middle">through ManifestWork</text>
  <text x="285.0" y="212.0" font-size="10" fill="#455A64" text-anchor="middle">status feedback</text>
  <rect x="200.0" y="250.0" width="230.0" height="66.0" rx="8" fill="#F3F0FA" stroke="#6B4FA8" stroke-width="1.5"/>
  <text x="315.0" y="272.0" font-size="12" fill="#4A3480" text-anchor="middle" font-weight="600">ReleaseBinding</text>
  <text x="315.0" y="288.0" font-size="10" fill="#455A64" text-anchor="middle">waits until the Resource</text>
  <text x="315.0" y="302.0" font-size="10" fill="#455A64" text-anchor="middle">is ready in the environment</text>
  <path d="M475.0,106.0 L475.0,193.0 L370.0,193.0" fill="none" stroke="#00838F" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a_00838F)"/>
  <path d="M285.0,226.0 L285.0,250.0" fill="none" stroke="#00838F" stroke-width="1.6" marker-end="url(#a_00838F)"/>
  <path d="M430.0,285.0 L680.0,285.0" fill="none" stroke="#6B4FA8" stroke-width="1.6" marker-end="url(#a_6B4FA8)"/>
  <text x="555.0" y="278.0" font-size="11" fill="#4A3480" text-anchor="middle" font-style="italic">then the workload is delivered</text>
</svg>
