  <text x="920.0" y="93.0" font-size="12" fill="#A33A00" text-anchor="middle" font-weight="600">kubectl ssp release export --to pr</text>
  <text x="920.0" y="109.0" font-size="10" fill="#455A64" text-anchor="middle">writes frozen release + pr binding + evidence</text>
  <text x="920.0" y="123.0" font-size="10" fill="#455A64" text-anchor="middle">to a branch of releases-pr, as the developer</text>
