<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="420" viewBox="0 0 1160 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Promotion: dv to te inside non-production through admission checks; te to pr only through an approved pull request on releases-pr</title>
