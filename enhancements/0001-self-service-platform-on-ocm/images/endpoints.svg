<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Endpoint visibility levels from project to external, and how dependencies are resolved and injected</title>
