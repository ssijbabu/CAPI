  <text x="96.0" y="164.0" font-size="12" fill="#1B5E20" text-anchor="start" font-weight="600">project · same application</text>
  <rect x="100.0" y="180.0" width="120.0" height="56.0" rx="8" fill="#FFFFFF" stroke="#90A4AE" stroke-width="1.5"/>
  <text x="160.0" y="203.5" font-size="11" fill="#263238" text-anchor="middle" font-weight="600">checkout-api</text>
  <text x="160.0" y="219.5" font-size="10" fill="#455A64" text-anchor="middle">Endpoint</text>
  <rect x="240.0" y="180.0" width="120.0" height="56.0" rx="8" fill="#FFFFFF" stroke="#90A4AE" stroke-width="1.5"/>
  <text x="300.0" y="203.5" font-size="11" fill="#263238" text-anchor="middle" font-weight="600">checkout-web</text>
