  <rect x="0" y="0" width="1120" height="470" fill="#FFFFFF"/>
  <rect x="20.0" y="20.0" width="640.0" height="430.0" rx="14" fill="#FFFFFF" stroke="#607D8B" stroke-width="1.5"/>
  <text x="40.0" y="46.0" font-size="12" fill="#37474F" text-anchor="start" font-weight="600">external · internet, through the environment&#x27;s external gateway</text>
