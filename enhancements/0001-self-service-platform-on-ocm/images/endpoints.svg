  <path d="M895.0,230.0 L895.0,254.0" fill="none" stroke="#C62828" stroke-width="1.6" marker-end="url(#a_C62828)"/>
  <rect x="730.0" y="348.0" width="330.0" height="70.0" rx="8" fill="#E0F2F1" stroke="#00838F" stroke-width="1.5"/>
  <text x="895.0" y="372.0" font-size="12" fill="#00695C" text-anchor="middle" font-weight="600">Injected</text>
  <text x="895.0" y="388.0" font-size="10" fill="#455A64" text-anchor="middle">CATALOG_URL into the rendered</text>
  <text x="895.0" y="402.0" font-size="10" fill="#455A64" text-anchor="middle">manifests of the caller</text>
  <path d="M895.0,324.0 L895.0,348.0" fill="none" stroke="#00838F" stroke-width="1.6" marker-end="url(#a_00838F)"/>
