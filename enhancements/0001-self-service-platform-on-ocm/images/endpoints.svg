  <text x="230.0" y="280.0" font-size="10" fill="#455A64" text-anchor="middle" font-style="italic">Rendered by the ClusterEndpointType:</text>
  <text x="230.0" y="296.0" font-size="10" fill="#455A64" text-anchor="middle" font-style="italic">routes, network policy per visibility</text>
