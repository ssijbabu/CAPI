  <rect x="56.0" y="538.0" width="12.0" height="12.0" rx="3" fill="#F3F0FA" stroke="#6B4FA8" stroke-width="1"/>
  <text x="78.0" y="548.0" font-size="11" fill="#263238" text-anchor="start">Application namespaces hold intent: what to run, where, and how to roll out.</text>
  <rect x="56.0" y="561.0" width="12.0" height="12.0" rx="3" fill="#E0F2F1" stroke="#00838F" stroke-width="1"/>
  <text x="78.0" y="571.0" font-size="11" fill="#263238" text-anchor="start">Cluster namespaces hold one ManifestWork per application per cluster.</text>
  <rect x="56.0" y="584.0" width="12.0" height="12.0" rx="3" fill="#F5F7F8" stroke="#607D8B" stroke-width="1"/>
  <text x="78.0" y="594.0" font-size="11" fill="#263238" text-anchor="start">ns-&lt;application&gt; works are platform-owned and prepare the namespace on the cluster.</text>
  <rect x="56.0" y="607.0" width="12.0" height="12.0" rx="3" fill="#FDECEA" stroke="#C62828" stroke-width="1"/>
  <text x="78.0" y="617.0" font-size="11" fill="#263238" text-anchor="start">Teams never write cluster namespaces; only SSP creates replica sets and placements.</text>
  <rect x="56.0" y="630.0" width="12.0" height="12.0" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1"/>
  <text x="78.0" y="640.0" font-size="11" fill="#263238" text-anchor="start">A shared cluster has one hub namespace, however many applications it runs.</text>
