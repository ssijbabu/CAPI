  <text x="656.0" y="210.0" font-size="11" fill="#00695C" text-anchor="start" font-style="italic">outbound, SPIFFE identity</text>
  <text x="540.0" y="362.0" font-size="11" fill="#1B5E20" text-anchor="start">✓ One agent, one inventory, one namespace per cluster (SR-6)</text>
