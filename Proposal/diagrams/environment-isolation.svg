<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Two isolated stacks: non-production (dv, te) and production (pr), each with its own control planes, registry, secrets, subscriptions and clusters; Git is the only link between them</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474F"/>
    </marker>
    <style>
      .title { font-size: 13px; font-weight: 600; fill: #1B2733; }
      .sub   { font-size: 11px; fill: #455A64; }
      .gnp   { font-size: 14px; font-weight: 700; fill: #0B5394; }
      .gpr   { font-size: 14px; font-weight: 700; fill: #B71C1C; }
      .ggit  { font-size: 14px; font-weight: 700; fill: #8E5A00; }
      .lbl   { font-size: 11px; fill: #37474F; font-style: italic; }
      .box   { fill: #FFFFFF; stroke: #607D8B; stroke-width: 1.3; }
      .git   { fill: #FFFFFF; stroke: #C77700; stroke-width: 1.3; }
      .clnp  { fill: #EEF4FB; stroke: #2F6FB0; stroke-width: 1.3; }
      .clpr  { fill: #FDECEA; stroke: #B71C1C; stroke-width: 1.3; }
      .flow  { stroke: #37474F; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="960" height="560" fill="#FFFFFF"/>

  <!-- Non-production stack -->
  <rect x="20" y="20" width="310" height="460" rx="12" fill="#F4F8FC" stroke="#2F6FB0" stroke-width="2"/>
  <text x="40" y="46" class="gnp">Non-production stack (dv, te)</text>

  <rect x="35" y="64" width="280" height="56" rx="6" class="box"/>
  <text x="175" y="86" text-anchor="middle" class="title">Platform control plane</text>
  <text x="175" y="104" text-anchor="middle" class="sub">Crossplane · CAPI · OCM hub · Kyverno · Argo CD</text>

  <rect x="35" y="134" width="280" height="56" rx="6" class="box"/>
  <text x="175" y="156" text-anchor="middle" class="title">OpenChoreo control plane</text>
  <text x="175" y="174" text-anchor="middle" class="sub">API · portal · workflow and observability planes</text>

  <rect x="35" y="204" width="280" height="56" rx="6" class="box"/>
  <text x="175" y="226" text-anchor="middle" class="title">Registry · secret store · identities</text>
  <text x="175" y="244" text-anchor="middle" class="sub">non-production only</text>

  <rect x="35" y="274" width="280" height="56" rx="6" class="box"/>
  <text x="175" y="296" text-anchor="middle" class="title">Infrastructure</text>
  <text x="175" y="314" text-anchor="middle" class="sub">non-prod subscriptions · vSphere Namespaces</text>

  <text x="40" y="358" class="sub" font-weight="600">Team clusters, one per environment</text>
  <rect x="35" y="370" width="133" height="90" rx="8" class="clnp"/>
  <text x="101" y="400" text-anchor="middle" class="title">payments-dv</text>
  <text x="101" y="418" text-anchor="middle" class="sub">VKS or AKS</text>
  <text x="101" y="436" text-anchor="middle" class="sub">Environment dv</text>
  <rect x="182" y="370" width="133" height="90" rx="8" class="clnp"/>
  <text x="248" y="400" text-anchor="middle" class="title">payments-te</text>
  <text x="248" y="418" text-anchor="middle" class="sub">VKS or AKS</text>
  <text x="248" y="436" text-anchor="middle" class="sub">Environment te</text>

  <!-- Git -->
  <rect x="400" y="20" width="160" height="460" rx="12" fill="#FFF8EC" stroke="#C77700" stroke-width="2"/>
  <text x="480" y="46" text-anchor="middle" class="ggit">Git</text>
  <text x="480" y="62" text-anchor="middle" class="sub">the only link</text>

  <rect x="410" y="76" width="140" height="62" rx="6" class="git"/>
  <text x="480" y="97" text-anchor="middle" class="title">platform</text>
  <text x="480" y="114" text-anchor="middle" class="sub">definitions, policies</text>
  <text x="480" y="129" text-anchor="middle" class="sub">released by tag</text>

  <rect x="410" y="152" width="140" height="62" rx="6" class="git"/>
  <text x="480" y="173" text-anchor="middle" class="title">platform-nonprod</text>
  <text x="480" y="190" text-anchor="middle" class="title">platform-pr</text>
  <text x="480" y="206" text-anchor="middle" class="sub">stack configuration</text>

  <rect x="410" y="228" width="140" height="78" rx="6" class="git"/>
  <text x="480" y="249" text-anchor="middle" class="title">team-payments</text>
  <text x="480" y="266" text-anchor="middle" class="sub">nonprod/: dv, te</text>
  <text x="480" y="281" text-anchor="middle" class="sub">pr/: protected,</text>
  <text x="480" y="296" text-anchor="middle" class="sub">lead approval</text>

  <rect x="410" y="320" width="140" height="62" rx="6" class="git"/>
  <text x="480" y="341" text-anchor="middle" class="title">app source</text>
  <text x="480" y="358" text-anchor="middle" class="sub">commit SHA is the</text>
  <text x="480" y="373" text-anchor="middle" class="sub">build input</text>

  <!-- Production stack -->
  <rect x="630" y="20" width="310" height="460" rx="12" fill="#FDF5F4" stroke="#B71C1C" stroke-width="2"/>
  <text x="650" y="46" class="gpr">Production stack (pr)</text>

  <rect x="645" y="64" width="280" height="56" rx="6" class="box"/>
  <text x="785" y="86" text-anchor="middle" class="title">Platform control plane</text>
  <text x="785" y="104" text-anchor="middle" class="sub">Crossplane · CAPI · OCM hub · Kyverno · Argo CD</text>

  <rect x="645" y="134" width="280" height="56" rx="6" class="box"/>
  <text x="785" y="156" text-anchor="middle" class="title">OpenChoreo control plane</text>
  <text x="785" y="174" text-anchor="middle" class="sub">API · portal · workflow and observability planes</text>

  <rect x="645" y="204" width="280" height="56" rx="6" class="box"/>
  <text x="785" y="226" text-anchor="middle" class="title">Registry · secret store · identities</text>
  <text x="785" y="244" text-anchor="middle" class="sub">production only</text>

  <rect x="645" y="274" width="280" height="56" rx="6" class="box"/>
  <text x="785" y="296" text-anchor="middle" class="title">Infrastructure</text>
  <text x="785" y="314" text-anchor="middle" class="sub">pr subscriptions · pr vSphere cluster</text>

  <text x="650" y="358" class="sub" font-weight="600">Team clusters</text>
  <rect x="645" y="370" width="133" height="90" rx="8" class="clpr"/>
  <text x="711" y="400" text-anchor="middle" class="title">payments-pr</text>
  <text x="711" y="418" text-anchor="middle" class="sub">VKS or AKS</text>
  <text x="711" y="436" text-anchor="middle" class="sub">Environment pr</text>
  <rect x="792" y="370" width="133" height="90" rx="8" class="clpr"/>
  <text x="858" y="400" text-anchor="middle" class="title">search-pr</text>
  <text x="858" y="418" text-anchor="middle" class="sub">VKS or AKS</text>
  <text x="858" y="436" text-anchor="middle" class="sub">Environment pr</text>

  <!-- Git links -->
  <line x1="400" y1="96" x2="317" y2="96" class="flow"/>
  <text x="365" y="88" text-anchor="middle" class="lbl">pulls</text>
  <line x1="560" y1="96" x2="643" y2="96" class="flow"/>
  <text x="595" y="88" text-anchor="middle" class="lbl">pulls</text>

  <line x1="317" y1="168" x2="408" y2="168" class="flow"/>
  <text x="365" y="160" text-anchor="middle" class="lbl">release PR</text>
  <line x1="560" y1="168" x2="643" y2="168" class="flow"/>
  <text x="595" y="160" text-anchor="middle" class="lbl">release</text>

  <line x1="560" y1="351" x2="580" y2="351" stroke="#37474F" stroke-width="1.6"/>
  <polyline points="580,351 580,182 643,182" class="flow"/>
  <text x="587" y="215" class="lbl">builds</text>
  <text x="587" y="229" class="lbl">from SHA</text>

  <!-- Isolation note -->
  <rect x="20" y="500" width="920" height="40" rx="8" fill="#FFFFFF" stroke="#B71C1C" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="480" y="525" text-anchor="middle" class="title" fill="#B71C1C">No network path, credential, registry or shared service between the stacks. Promotion to pr is a reviewed commit.</text>
</svg>
