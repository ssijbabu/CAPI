<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Azure resources per workload cluster and the CAPZ object that declares them</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474F"/>
    </marker>
    <style>
      .band  { font-size: 13px; font-weight: 700; fill: #1F4E79; }
      .title { font-size: 13px; font-weight: 600; fill: #1B2733; }
      .sub   { font-size: 11px; fill: #455A64; }
      .box   { fill: #FFFFFF; stroke: #2F6FB0; stroke-width: 1.5; }
      .opt   { fill: #FFFFFF; stroke: #2F6FB0; stroke-width: 1.5; stroke-dasharray: 5 3; }
      .own   { stroke: #37474F; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .ref   { stroke: #8E5A00; stroke-width: 1.4; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="960" height="470" fill="#FFFFFF"/>

  <!-- Bands: which CAPZ object declares the resources -->
  <rect x="20" y="20" width="440" height="380" rx="10" fill="#EEF4FB" stroke="#2F6FB0"/>
  <text x="36" y="44" class="band">AzureASOManagedCluster · spec.resources</text>

  <rect x="480" y="20" width="220" height="380" rx="10" fill="#F3F0FA" stroke="#6B4FA8"/>
  <text x="496" y="44" class="band">AzureASOManaged</text>
  <text x="496" y="60" class="band">ControlPlane</text>

  <rect x="720" y="20" width="220" height="380" rx="10" fill="#EEF7EE" stroke="#2E7D32"/>
  <text x="736" y="44" class="band">AzureASOManaged</text>
  <text x="736" y="60" class="band">MachinePool (one per pool)</text>

  <!-- Resource group -->
  <rect x="150" y="90" width="180" height="48" rx="6" class="box"/>
  <text x="240" y="111" text-anchor="middle" class="title">ResourceGroup</text>
  <text x="240" y="128" text-anchor="middle" class="sub">rg-&lt;cluster&gt;</text>

  <!-- Row 1 -->
  <rect x="40" y="190" width="120" height="48" rx="6" class="box"/>
  <text x="100" y="211" text-anchor="middle" class="title">VirtualNetwork</text>
  <text x="100" y="228" text-anchor="middle" class="sub">+ NSG</text>

  <rect x="180" y="190" width="120" height="48" rx="6" class="box"/>
  <text x="240" y="211" text-anchor="middle" class="title">Log Analytics</text>
  <text x="240" y="228" text-anchor="middle" class="sub">workspace</text>

  <rect x="320" y="190" width="120" height="48" rx="6" class="box"/>
  <text x="380" y="211" text-anchor="middle" class="title">Managed</text>
  <text x="380" y="228" text-anchor="middle" class="sub">identities (CP, kubelet)</text>

  <!-- Row 2 -->
  <rect x="40" y="280" width="120" height="48" rx="6" class="box"/>
  <text x="100" y="301" text-anchor="middle" class="title">Subnets</text>
  <text x="100" y="318" text-anchor="middle" class="sub">nodes · endpoints</text>

  <rect x="180" y="280" width="120" height="48" rx="6" class="opt"/>
  <text x="240" y="301" text-anchor="middle" class="title">ACR · Key Vault</text>
  <text x="240" y="318" text-anchor="middle" class="sub">optional, owner: RG</text>

  <rect x="320" y="280" width="120" height="48" rx="6" class="box"/>
  <text x="380" y="301" text-anchor="middle" class="title">RoleAssignments</text>
  <text x="380" y="318" text-anchor="middle" class="sub">AcrPull + network role</text>

  <!-- Managed cluster -->
  <rect x="500" y="190" width="180" height="48" rx="6" class="box"/>
  <text x="590" y="211" text-anchor="middle" class="title">ManagedCluster</text>
  <text x="590" y="228" text-anchor="middle" class="sub">AKS control plane</text>

  <!-- Agent pools -->
  <rect x="740" y="190" width="180" height="48" rx="6" class="box"/>
  <text x="830" y="211" text-anchor="middle" class="title">AgentPool: system</text>
  <text x="830" y="228" text-anchor="middle" class="sub">mode: System, 3 zones</text>

  <rect x="740" y="280" width="180" height="48" rx="6" class="box"/>
  <text x="830" y="301" text-anchor="middle" class="title">AgentPool: user</text>
  <text x="830" y="318" text-anchor="middle" class="sub">mode: User, autoscaling</text>

  <!-- Ownership (ARM parent) edges -->
  <polyline points="240,138 240,164 100,164 100,188" class="own"/>
  <line x1="240" y1="164" x2="240" y2="188" class="own"/>
  <polyline points="240,164 380,164 380,188" class="own"/>
  <line x1="100" y1="238" x2="100" y2="278" class="own"/>
  <polyline points="330,114 590,114 590,188" class="own"/>
  <line x1="680" y1="214" x2="738" y2="214" class="own"/>
  <polyline points="700,214 700,304 738,304" class="own"/>
  <circle cx="700" cy="214" r="3" fill="#37474F"/>

  <!-- References -->
  <line x1="498" y1="214" x2="442" y2="214" class="ref"/>
  <line x1="380" y1="238" x2="380" y2="278" class="ref"/>
  <polyline points="830,328 830,370 100,370 100,330" class="ref"/>

  <!-- Legend -->
  <line x1="40" y1="440" x2="80" y2="440" class="own"/>
  <text x="88" y="444" class="sub">owner (ARM parent; deleted with parent)</text>
  <line x1="340" y1="440" x2="380" y2="440" class="ref"/>
  <text x="388" y="444" class="sub">reference (identity, subnet, role scope)</text>
  <rect x="640" y="430" width="30" height="20" rx="3" class="opt"/>
  <text x="678" y="444" class="sub">optional resource</text>
</svg>
