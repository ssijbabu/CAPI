<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>One cluster request, rendered per platform by Argo CD</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474F"/>
    </marker>
    <style>
      .title { font-size: 13px; font-weight: 600; fill: #1B2733; }
      .sub   { font-size: 11px; fill: #455A64; }
      .ck    { font-size: 11px; font-weight: 600; fill: #1B2733; }
      .cs    { font-size: 10px; fill: #546E7A; }
      .gaz   { font-size: 13px; font-weight: 700; fill: #0B5394; }
      .gvs   { font-size: 13px; font-weight: 700; fill: #2E7D32; }
      .lbl   { font-size: 11px; fill: #37474F; font-style: italic; }
      .flow  { stroke: #37474F; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .chipA { fill: #FFFFFF; stroke: #2F6FB0; stroke-width: 1.2; }
      .chipV { fill: #FFFFFF; stroke: #2E7D32; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="960" height="480" fill="#FFFFFF"/>

  <!-- Request -->
  <text x="20" y="168" class="lbl">Team request (values file in Git)</text>
  <rect x="20" y="178" width="185" height="118" rx="8" fill="#FFF5E6" stroke="#C77700" stroke-width="1.5"/>
  <text x="112" y="200" text-anchor="middle" class="title">cluster.yaml</text>
  <text x="32" y="222" class="sub">platform: azure | vsphere</text>
  <text x="32" y="240" class="sub">size: small | medium | large</text>
  <text x="32" y="258" class="sub">version: "1.33"</text>
  <text x="32" y="276" class="sub">nodePools, network, region</text>

  <!-- Renderer -->
  <rect x="226" y="200" width="134" height="74" rx="37" fill="#FFF5E6" stroke="#C77700" stroke-width="1.5"/>
  <text x="293" y="226" text-anchor="middle" class="title">ApplicationSet</text>
  <text x="293" y="243" text-anchor="middle" class="sub">cluster-request</text>
  <text x="293" y="257" text-anchor="middle" class="sub">Helm chart</text>
  <line x1="205" y1="237" x2="224" y2="237" class="flow"/>

  <polyline points="360,237 374,237 374,125 388,125" class="flow"/>
  <polyline points="374,237 374,355 388,355" class="flow"/>
  <text x="368" y="160" text-anchor="end" class="lbl">azure</text>
  <text x="368" y="322" text-anchor="end" class="lbl">vsphere</text>

  <!-- Azure -->
  <rect x="390" y="20" width="555" height="210" rx="10" fill="#EEF4FB" stroke="#2F6FB0" stroke-width="1.5"/>
  <text x="405" y="42" class="gaz">Destination: management cluster · clusters-&lt;team&gt;</text>
  <text x="405" y="62" class="sub">Reconciled by CAPI core → CAPZ → ASO → Azure Resource Manager</text>

  <rect x="405" y="78" width="125" height="44" rx="5" class="chipA"/>
  <text x="467" y="97" text-anchor="middle" class="ck">Cluster</text>
  <text x="467" y="112" text-anchor="middle" class="cs">topology: aks-*</text>
  <rect x="537" y="78" width="125" height="44" rx="5" class="chipA"/>
  <text x="599" y="97" text-anchor="middle" class="ck">ASO ManagedCluster</text>
  <text x="599" y="112" text-anchor="middle" class="cs">RG · VNet · MI · LAW</text>
  <rect x="669" y="78" width="125" height="44" rx="5" class="chipA"/>
  <text x="731" y="97" text-anchor="middle" class="ck">ASO ControlPlane</text>
  <text x="731" y="112" text-anchor="middle" class="cs">AKS ManagedCluster</text>
  <rect x="801" y="78" width="125" height="44" rx="5" class="chipA"/>
  <text x="863" y="97" text-anchor="middle" class="ck">MachinePool ×N</text>
  <text x="863" y="112" text-anchor="middle" class="cs">AKS agent pools</text>

  <text x="405" y="150" class="sub">Rendered from the aks-standard / aks-private ClusterClass; supporting resources</text>
  <text x="405" y="166" class="sub">(RG, VNet, subnets, NSG, identities, role assignments, Log Analytics, ACR) included.</text>
  <text x="405" y="205" class="sub">Output → Cluster Ready + &lt;name&gt;-kubeconfig secret in the management cluster</text>

  <!-- vSphere -->
  <rect x="390" y="250" width="555" height="210" rx="10" fill="#EEF7EE" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="405" y="272" class="gvs">Destination: Supervisor · vSphere Namespace</text>
  <text x="405" y="292" class="sub">Reconciled by the Supervisor's own Cluster API and VKS controllers</text>

  <rect x="405" y="308" width="125" height="44" rx="5" class="chipV" stroke-dasharray="4 3"/>
  <text x="467" y="327" text-anchor="middle" class="ck">vSphere Namespace</text>
  <text x="467" y="342" text-anchor="middle" class="cs">self-service (optional)</text>
  <rect x="537" y="308" width="125" height="44" rx="5" class="chipV"/>
  <text x="599" y="327" text-anchor="middle" class="ck">Cluster</text>
  <text x="599" y="342" text-anchor="middle" class="cs">class: builtin-generic</text>
  <line x1="530" y1="330" x2="535" y2="330" class="flow"/>

  <text x="680" y="327" class="sub">Supervisor provides node VMs,</text>
  <text x="680" y="343" class="sub">load balancer, networks and volumes.</text>

  <text x="405" y="385" class="sub">Variables mapped from the request: vmClass (size), storageClass,</text>
  <text x="405" y="401" class="sub">Kubernetes release (version), worker machineDeployments (nodePools).</text>
  <text x="405" y="435" class="sub">Output → Cluster Ready + &lt;name&gt;-kubeconfig secret in the vSphere Namespace</text>
</svg>
