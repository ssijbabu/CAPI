<svg xmlns="http://www.w3.org/2000/svg" width="960" height="575" viewBox="0 0 960 575" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Self-service platform: Crossplane API over Cluster API on Azure and VMware vSphere with Tanzu</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474F"/>
    </marker>
    <style>
      .title { font-size: 13px; font-weight: 600; fill: #1B2733; }
      .sub   { font-size: 11px; fill: #455A64; }
      .group { font-size: 14px; font-weight: 700; fill: #4A2F86; }
      .gaz   { font-size: 14px; font-weight: 700; fill: #0B5394; }
      .gvs   { font-size: 14px; font-weight: 700; fill: #2E7D32; }
      .lbl   { font-size: 11px; fill: #37474F; font-style: italic; }
      .xp    { fill: #FFFFFF; stroke: #6B4FA8; stroke-width: 1.5; }
      .capi  { fill: #FFFFFF; stroke: #2F6FB0; stroke-width: 1.5; }
      .flow  { stroke: #37474F; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .dash  { stroke: #37474F; stroke-width: 1.4; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="960" height="575" fill="#FFFFFF"/>

  <!-- Teams and Git -->
  <rect x="20" y="78" width="150" height="52" rx="8" fill="#FFF5E6" stroke="#C77700" stroke-width="1.5"/>
  <text x="95" y="100" text-anchor="middle" class="title">Git</text>
  <text x="95" y="118" text-anchor="middle" class="sub">team + platform repos</text>

  <rect x="20" y="165" width="150" height="52" rx="8" fill="#FFF5E6" stroke="#C77700" stroke-width="1.5"/>
  <text x="95" y="187" text-anchor="middle" class="title">App teams</text>
  <text x="95" y="205" text-anchor="middle" class="sub">Backstage form / YAML</text>
  <line x1="95" y1="165" x2="95" y2="132" class="flow"/>

  <!-- Control plane -->
  <rect x="190" y="30" width="750" height="210" rx="12" fill="#F3F0FA" stroke="#6B4FA8" stroke-width="2"/>
  <text x="210" y="56" class="group">Platform control plane (VKS cluster on premises)</text>

  <rect x="210" y="78" width="165" height="52" rx="6" fill="#FFFFFF" stroke="#C77700" stroke-width="1.5"/>
  <text x="292" y="100" text-anchor="middle" class="title">Argo CD</text>
  <text x="292" y="118" text-anchor="middle" class="sub">syncs XRs per team</text>

  <rect x="395" y="78" width="165" height="52" rx="6" class="xp"/>
  <text x="477" y="100" text-anchor="middle" class="title">Crossplane v2</text>
  <text x="477" y="118" text-anchor="middle" class="sub">XRDs · Compositions</text>

  <rect x="580" y="78" width="165" height="52" rx="6" class="xp"/>
  <text x="662" y="100" text-anchor="middle" class="title">Kyverno</text>
  <text x="662" y="118" text-anchor="middle" class="sub">admission guardrails</text>

  <rect x="765" y="78" width="165" height="52" rx="6" fill="#FFFFFF" stroke="#8E5A00" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="847" y="100" text-anchor="middle" class="title">Credentials</text>
  <text x="847" y="118" text-anchor="middle" class="sub">Azure identity · vSphere SA</text>

  <rect x="210" y="165" width="165" height="52" rx="6" class="xp"/>
  <text x="292" y="187" text-anchor="middle" class="title">provider-kubernetes</text>
  <text x="292" y="205" text-anchor="middle" class="sub">objects on Supervisor</text>

  <rect x="395" y="165" width="165" height="52" rx="6" class="xp"/>
  <text x="477" y="187" text-anchor="middle" class="title">provider-helm</text>
  <text x="477" y="205" text-anchor="middle" class="sub">baseline add-ons</text>

  <rect x="580" y="165" width="165" height="52" rx="6" class="capi"/>
  <text x="662" y="187" text-anchor="middle" class="title">CAPI core + CAPZ</text>
  <text x="662" y="205" text-anchor="middle" class="sub">AKS lifecycle</text>

  <rect x="765" y="165" width="165" height="52" rx="6" class="capi"/>
  <text x="847" y="187" text-anchor="middle" class="title">ASO v2</text>
  <text x="847" y="205" text-anchor="middle" class="sub">Azure resources</text>

  <line x1="170" y1="104" x2="208" y2="104" class="flow"/>
  <line x1="375" y1="104" x2="393" y2="104" class="flow"/>
  <polyline points="477,130 477,148" fill="none" stroke="#37474F" stroke-width="1.6"/>
  <line x1="292" y1="148" x2="662" y2="148" stroke="#37474F" stroke-width="1.6"/>
  <line x1="292" y1="148" x2="292" y2="163" class="flow"/>
  <line x1="477" y1="148" x2="477" y2="163" class="flow"/>
  <line x1="662" y1="148" x2="662" y2="163" class="flow"/>
  <line x1="745" y1="191" x2="763" y2="191" class="flow"/>
  <text x="560" y="143" class="lbl">composes</text>

  <!-- vSphere -->
  <rect x="20" y="290" width="450" height="225" rx="12" fill="#EEF7EE" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="40" y="314" class="gvs">VMware vSphere with Tanzu (on-premises)</text>
  <rect x="40" y="330" width="410" height="40" rx="6" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="245" y="355" text-anchor="middle" class="title">Supervisor · built-in Cluster API + VKS</text>
  <rect x="40" y="388" width="410" height="115" rx="8" fill="#F7FBF7" stroke="#2E7D32" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="55" y="406" class="sub" font-weight="600">vSphere Namespace</text>
  <rect x="55" y="416" width="185" height="75" rx="8" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="147" y="438" text-anchor="middle" class="title">payments-onprem</text>
  <text x="147" y="458" text-anchor="middle" class="sub">VKS cluster</text>
  <text x="147" y="475" text-anchor="middle" class="sub">control plane + worker VMs</text>
  <rect x="255" y="416" width="185" height="75" rx="8" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="347" y="438" text-anchor="middle" class="title">search-onprem</text>
  <text x="347" y="458" text-anchor="middle" class="sub">VKS cluster</text>
  <text x="347" y="475" text-anchor="middle" class="sub">control plane + worker VMs</text>
  <line x1="200" y1="370" x2="200" y2="414" class="flow"/>
  <line x1="400" y1="370" x2="400" y2="414" class="flow"/>

  <!-- Azure -->
  <rect x="490" y="290" width="450" height="225" rx="12" fill="#EEF4FB" stroke="#2F6FB0" stroke-width="1.5"/>
  <text x="510" y="314" class="gaz">Microsoft Azure</text>
  <rect x="510" y="330" width="410" height="40" rx="6" fill="#FFFFFF" stroke="#2F6FB0" stroke-width="1.5"/>
  <text x="715" y="355" text-anchor="middle" class="title">Azure Resource Manager (ARM)</text>
  <rect x="510" y="400" width="195" height="95" rx="8" fill="#FFFFFF" stroke="#2F6FB0" stroke-width="1.5"/>
  <text x="607" y="422" text-anchor="middle" class="title">payments-prd</text>
  <text x="607" y="442" text-anchor="middle" class="sub">AKS + node pools</text>
  <text x="607" y="459" text-anchor="middle" class="sub">RG · VNet · NSG · identities</text>
  <text x="607" y="476" text-anchor="middle" class="sub">ACR · Log Analytics</text>
  <rect x="725" y="400" width="195" height="95" rx="8" fill="#FFFFFF" stroke="#2F6FB0" stroke-width="1.5"/>
  <text x="822" y="422" text-anchor="middle" class="title">search-dev</text>
  <text x="822" y="442" text-anchor="middle" class="sub">AKS + node pools</text>
  <text x="822" y="459" text-anchor="middle" class="sub">RG · VNet · NSG · identities</text>
  <text x="822" y="476" text-anchor="middle" class="sub">ACR · Log Analytics</text>
  <line x1="607" y1="370" x2="607" y2="398" class="flow"/>
  <line x1="822" y1="370" x2="822" y2="398" class="flow"/>

  <!-- control plane → platforms -->
  <line x1="292" y1="217" x2="292" y2="328" class="flow"/>
  <text x="286" y="262" text-anchor="end" class="lbl">VKS Cluster objects</text>
  <line x1="847" y1="217" x2="847" y2="328" class="flow"/>
  <text x="855" y="270" class="lbl">ARM API</text>

  <polyline points="477,217 477,265" fill="none" stroke="#37474F" stroke-width="1.4" stroke-dasharray="6 4"/>
  <polyline points="477,265 420,265 420,288" class="dash"/>
  <polyline points="477,265 530,265 530,288" class="dash"/>
  <text x="540" y="258" class="lbl">Helm add-ons</text>

  <!-- Legend -->
  <rect x="40" y="542" width="22" height="14" rx="3" class="xp"/>
  <text x="70" y="554" class="sub">Crossplane (self-service layer)</text>
  <rect x="260" y="542" width="22" height="14" rx="3" class="capi"/>
  <text x="290" y="554" class="sub">Cluster API (lifecycle engine)</text>
  <line x1="480" y1="550" x2="520" y2="550" class="flow"/>
  <text x="528" y="554" class="sub">provision / reconcile</text>
  <line x1="660" y1="550" x2="700" y2="550" class="dash"/>
  <text x="708" y="554" class="sub">add-on install</text>
</svg>
