<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Fleet layer: the Composition registers each cluster with the Open Cluster Management hub; agents on the clusters pull add-ons and policy and report health back to the KubernetesCluster status</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474F"/>
    </marker>
    <marker id="arrowOcm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00838F"/>
    </marker>
    <style>
      .title { font-size: 13px; font-weight: 600; fill: #1B2733; }
      .sub   { font-size: 11px; fill: #455A64; }
      .gocm  { font-size: 14px; font-weight: 700; fill: #00695C; }
      .lbl   { font-size: 11px; fill: #37474F; font-style: italic; }
      .lblo  { font-size: 11px; fill: #00695C; font-style: italic; }
      .xp    { fill: #F3F0FA; stroke: #6B4FA8; stroke-width: 1.5; }
      .capi  { fill: #EEF4FB; stroke: #2F6FB0; stroke-width: 1.5; }
      .ocm   { fill: #FFFFFF; stroke: #00838F; stroke-width: 1.5; }
      .pill  { fill: #E0F2F1; stroke: #00838F; stroke-width: 1; }
      .ptxt  { font-size: 10px; font-weight: 600; fill: #00695C; }
      .flow  { stroke: #37474F; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .pull  { stroke: #00838F; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrowOcm); }
      .once  { stroke: #8E5A00; stroke-width: 1.3; fill: none; stroke-dasharray: 2 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="960" height="560" fill="#FFFFFF"/>

  <!-- Row 1: request, composition, lifecycle -->
  <rect x="20" y="24" width="270" height="62" rx="8" fill="#FFF5E6" stroke="#C77700" stroke-width="1.5"/>
  <text x="155" y="48" text-anchor="middle" class="title">KubernetesCluster (team namespace)</text>
  <text x="155" y="68" text-anchor="middle" class="sub">status: Ready · endpoint · version</text>

  <rect x="345" y="24" width="270" height="62" rx="8" class="xp"/>
  <text x="480" y="48" text-anchor="middle" class="title">Composition (azure or vsphere)</text>
  <text x="480" y="68" text-anchor="middle" class="sub">renders lifecycle and fleet objects</text>

  <rect x="670" y="24" width="270" height="62" rx="8" class="capi"/>
  <text x="805" y="48" text-anchor="middle" class="title">CAPI + CAPZ / Supervisor</text>
  <text x="805" y="68" text-anchor="middle" class="sub">builds and upgrades the cluster</text>

  <line x1="290" y1="55" x2="343" y2="55" class="flow"/>
  <line x1="615" y1="55" x2="668" y2="55" class="flow"/>
  <text x="642" y="46" text-anchor="middle" class="lbl">Cluster</text>

  <line x1="480" y1="86" x2="480" y2="128" class="flow"/>
  <text x="490" y="112" class="lbl">ManagedCluster + ManagedClusterAddOns</text>

  <line x1="155" y1="130" x2="155" y2="88" class="pull"/>
  <text x="165" y="112" class="lblo">health → Ready</text>

  <!-- Row 2: OCM hub -->
  <rect x="20" y="130" width="920" height="178" rx="12" fill="#F0F8F8" stroke="#00838F" stroke-width="2"/>
  <text x="40" y="154" class="gocm">OCM hub (one per stack, on its platform control plane)</text>

  <rect x="40" y="168" width="285" height="54" rx="6" class="ocm"/>
  <text x="182" y="190" text-anchor="middle" class="title">Registration</text>
  <text x="182" y="208" text-anchor="middle" class="sub">ManagedCluster · import · heartbeat</text>

  <rect x="337" y="168" width="285" height="54" rx="6" class="ocm"/>
  <text x="479" y="190" text-anchor="middle" class="title">ManagedClusterSets</text>
  <text x="479" y="208" text-anchor="middle" class="sub">one per team, bound to its namespace</text>

  <rect x="634" y="168" width="285" height="54" rx="6" class="ocm"/>
  <text x="776" y="190" text-anchor="middle" class="title">Placement</text>
  <text x="776" y="208" text-anchor="middle" class="sub">select clusters by platform, environment</text>

  <rect x="40" y="236" width="285" height="54" rx="6" class="ocm"/>
  <text x="182" y="258" text-anchor="middle" class="title">Add-on manager</text>
  <text x="182" y="276" text-anchor="middle" class="sub">baseline add-ons through ManifestWork</text>

  <rect x="337" y="236" width="285" height="54" rx="6" class="ocm"/>
  <text x="479" y="258" text-anchor="middle" class="title">Policy</text>
  <text x="479" y="276" text-anchor="middle" class="sub">in-cluster baseline · compliance per cluster</text>

  <rect x="634" y="236" width="285" height="54" rx="6" class="ocm"/>
  <text x="776" y="258" text-anchor="middle" class="title">cluster-proxy</text>
  <text x="776" y="276" text-anchor="middle" class="sub">audited break-glass access</text>

  <!-- Row 3: workload clusters -->
  <rect x="40" y="390" width="285" height="96" rx="8" fill="#EEF4FB" stroke="#2F6FB0" stroke-width="1.5"/>
  <text x="182" y="413" text-anchor="middle" class="title">payments-te</text>
  <text x="182" y="431" text-anchor="middle" class="sub">AKS (Azure)</text>
  <rect x="87" y="446" width="190" height="22" rx="11" class="pill"/>
  <text x="182" y="461" text-anchor="middle" class="ptxt">klusterlet + add-on agents</text>

  <rect x="337" y="390" width="285" height="96" rx="8" fill="#EEF7EE" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="479" y="413" text-anchor="middle" class="title">payments-dv</text>
  <text x="479" y="431" text-anchor="middle" class="sub">VKS (team vSphere Namespace)</text>
  <rect x="384" y="446" width="190" height="22" rx="11" class="pill"/>
  <text x="479" y="461" text-anchor="middle" class="ptxt">klusterlet + add-on agents</text>

  <rect x="634" y="390" width="285" height="96" rx="8" fill="#EEF4FB" stroke="#2F6FB0" stroke-width="1.5"/>
  <text x="776" y="413" text-anchor="middle" class="title">search-te</text>
  <text x="776" y="431" text-anchor="middle" class="sub">AKS (Azure)</text>
  <rect x="681" y="446" width="190" height="22" rx="11" class="pill"/>
  <text x="776" y="461" text-anchor="middle" class="ptxt">klusterlet + add-on agents</text>

  <!-- agents connect outbound to the hub -->
  <line x1="120" y1="388" x2="120" y2="310" class="pull"/>
  <line x1="417" y1="388" x2="417" y2="310" class="pull"/>
  <line x1="714" y1="388" x2="714" y2="310" class="pull"/>
  <text x="279" y="345" text-anchor="middle" class="lblo">pull ManifestWork and policy;</text>
  <text x="279" y="360" text-anchor="middle" class="lblo">report heartbeat and add-on health</text>

  <!-- one-time import -->
  <line x1="142" y1="310" x2="142" y2="388" class="once"/>
  <line x1="439" y1="310" x2="439" y2="388" class="once"/>
  <line x1="736" y1="310" x2="736" y2="388" class="once"/>
  <text x="576" y="345" text-anchor="middle" class="lbl">one-time import, using the</text>
  <text x="576" y="360" text-anchor="middle" class="lbl">cluster's bootstrap kubeconfig</text>

  <!-- Legend -->
  <line x1="40" y1="525" x2="80" y2="525" class="pull"/>
  <text x="88" y="529" class="sub">outbound from the cluster (steady state)</text>
  <line x1="340" y1="525" x2="380" y2="525" class="once"/>
  <text x="388" y="529" class="sub">hub to cluster, once at import</text>
  <line x1="600" y1="525" x2="640" y2="525" class="flow"/>
  <text x="648" y="529" class="sub">create / reconcile on the control plane</text>
</svg>
