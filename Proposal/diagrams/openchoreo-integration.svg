<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>OpenChoreo on the self-service platform: the platform builds and registers data plane clusters; developers deploy through OpenChoreo, whose cluster agents and the OCM agents both connect outbound</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474F"/>
    </marker>
    <marker id="arrowOcm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00838F"/>
    </marker>
    <marker id="arrowOc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/>
    </marker>
    <style>
      .title { font-size: 13px; font-weight: 600; fill: #1B2733; }
      .sub   { font-size: 11px; fill: #455A64; }
      .group { font-size: 14px; font-weight: 700; fill: #4A2F86; }
      .goc   { font-size: 14px; font-weight: 700; fill: #9A3412; }
      .gdp   { font-size: 14px; font-weight: 700; fill: #1B2733; }
      .lbl   { font-size: 11px; fill: #37474F; font-style: italic; }
      .lblo  { font-size: 11px; fill: #00695C; font-style: italic; }
      .lblc  { font-size: 11px; fill: #9A3412; font-style: italic; }
      .xp    { fill: #FFFFFF; stroke: #6B4FA8; stroke-width: 1.5; }
      .ocm   { fill: #FFFFFF; stroke: #00838F; stroke-width: 1.5; }
      .oc    { fill: #FFFFFF; stroke: #C2410C; stroke-width: 1.5; }
      .pillo { fill: #E0F2F1; stroke: #00838F; stroke-width: 1; }
      .pillc { fill: #FFEDD5; stroke: #C2410C; stroke-width: 1; }
      .ptxo  { font-size: 10px; font-weight: 600; fill: #00695C; }
      .ptxc  { font-size: 10px; font-weight: 600; fill: #9A3412; }
      .env   { font-size: 11px; font-weight: 600; fill: #9A3412; }
      .flow  { stroke: #37474F; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .pull  { stroke: #00838F; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrowOcm); }
      .agent { stroke: #C2410C; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrowOc); }
    </style>
  </defs>

  <rect width="960" height="590" fill="#FFFFFF"/>

  <!-- People -->
  <rect x="20" y="40" width="200" height="54" rx="8" fill="#FFF5E6" stroke="#C77700" stroke-width="1.5"/>
  <text x="120" y="63" text-anchor="middle" class="title">Developers / AI agents</text>
  <text x="120" y="81" text-anchor="middle" class="sub">projects, components, promotions</text>

  <rect x="20" y="118" width="200" height="54" rx="8" fill="#FFF5E6" stroke="#C77700" stroke-width="1.5"/>
  <text x="120" y="141" text-anchor="middle" class="title">App team (Git)</text>
  <text x="120" y="159" text-anchor="middle" class="sub">one cluster per environment</text>

  <!-- OpenChoreo control plane -->
  <rect x="500" y="20" width="440" height="318" rx="12" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
  <text x="520" y="44" class="goc">OpenChoreo control plane (one per stack)</text>

  <rect x="520" y="58" width="400" height="50" rx="6" class="oc"/>
  <text x="720" y="79" text-anchor="middle" class="title">Developer portal (Backstage)</text>
  <text x="720" y="96" text-anchor="middle" class="sub">also hosts the KubernetesCluster template</text>

  <rect x="520" y="122" width="400" height="50" rx="6" class="oc"/>
  <text x="720" y="143" text-anchor="middle" class="title">OpenChoreo API and controllers</text>
  <text x="720" y="160" text-anchor="middle" class="sub">Project · Component · Environment · DeploymentPipeline</text>

  <rect x="520" y="186" width="400" height="50" rx="6" class="oc"/>
  <text x="720" y="207" text-anchor="middle" class="title">Workflow plane + observability plane</text>
  <text x="720" y="224" text-anchor="middle" class="sub">builds · logs, metrics, alerts (same cluster to start)</text>

  <rect x="520" y="250" width="400" height="50" rx="6" class="oc"/>
  <text x="720" y="271" text-anchor="middle" class="title">Cluster gateway</text>
  <text x="720" y="288" text-anchor="middle" class="sub">a DataPlane per team cluster · agents connect here</text>

  <!-- Platform control plane -->
  <rect x="20" y="200" width="380" height="138" rx="12" fill="#F3F0FA" stroke="#6B4FA8" stroke-width="2"/>
  <text x="214" y="224" class="group">Platform control plane</text>

  <rect x="36" y="242" width="170" height="60" rx="6" class="xp"/>
  <text x="121" y="266" text-anchor="middle" class="title">Crossplane + CAPI</text>
  <text x="121" y="284" text-anchor="middle" class="sub">builds AKS and VKS</text>

  <rect x="214" y="242" width="170" height="60" rx="6" class="ocm"/>
  <text x="299" y="266" text-anchor="middle" class="title">OCM hub</text>
  <text x="299" y="284" text-anchor="middle" class="sub">data plane chart · baseline</text>

  <!-- people arrows -->
  <line x1="220" y1="67" x2="518" y2="83" class="flow"/>
  <text x="370" y="64" text-anchor="middle" class="lbl">portal, CLI or Git</text>
  <line x1="121" y1="172" x2="121" y2="240" class="flow"/>
  <text x="128" y="190" class="lbl">KubernetesCluster · purpose: openchoreo-data-plane</text>

  <!-- OCM registers the data plane in OpenChoreo -->
  <line x1="384" y1="275" x2="518" y2="275" class="pull"/>
  <text x="451" y="300" text-anchor="middle" class="lblo">ManifestWork:</text>
  <text x="451" y="314" text-anchor="middle" class="lblo">team DataPlane</text>

  <!-- Data planes -->
  <rect x="20" y="398" width="920" height="140" rx="12" fill="#F7F9FA" stroke="#607D8B" stroke-width="1.5"/>
  <text x="40" y="422" class="gdp">Team payments, non-production stack · promotion dv → te through Git</text>

  <rect x="40" y="434" width="280" height="92" rx="8" fill="#EEF7EE" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="180" y="454" text-anchor="middle" class="title">payments-dv</text>
  <text x="180" y="470" text-anchor="middle" class="sub">VKS, on premises</text>
  <text x="180" y="487" text-anchor="middle" class="env">Environment: dv</text>
  <rect x="62" y="498" width="130" height="18" rx="9" class="pillc"/>
  <text x="127" y="511" text-anchor="middle" class="ptxc">OpenChoreo agent</text>
  <rect x="202" y="498" width="96" height="18" rx="9" class="pillo"/>
  <text x="250" y="511" text-anchor="middle" class="ptxo">OCM agent</text>

  <rect x="340" y="434" width="280" height="92" rx="8" fill="#EEF4FB" stroke="#2F6FB0" stroke-width="1.5"/>
  <text x="480" y="454" text-anchor="middle" class="title">payments-te</text>
  <text x="480" y="470" text-anchor="middle" class="sub">AKS</text>
  <text x="480" y="487" text-anchor="middle" class="env">Environment: te</text>
  <rect x="362" y="498" width="130" height="18" rx="9" class="pillc"/>
  <text x="427" y="511" text-anchor="middle" class="ptxc">OpenChoreo agent</text>
  <rect x="502" y="498" width="96" height="18" rx="9" class="pillo"/>
  <text x="550" y="511" text-anchor="middle" class="ptxo">OCM agent</text>

  <rect x="640" y="434" width="280" height="92" rx="8" fill="#FFFFFF" stroke="#B71C1C" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="780" y="456" text-anchor="middle" class="title">payments-pr</text>
  <text x="780" y="474" text-anchor="middle" class="sub">in the isolated pr stack, with its own</text>
  <text x="780" y="490" text-anchor="middle" class="sub">platform and OpenChoreo control planes</text>
  <text x="780" y="511" text-anchor="middle" class="env" fill="#B71C1C">reached only through Git</text>

  <!-- builds / agents -->
  <line x1="121" y1="302" x2="121" y2="396" class="flow"/>
  <text x="129" y="360" class="lbl">builds</text>
  <line x1="299" y1="396" x2="299" y2="304" class="pull"/>
  <text x="307" y="360" class="lblo">OCM agents (outbound)</text>
  <line x1="560" y1="396" x2="560" y2="302" class="agent"/>
  <text x="568" y="352" class="lblc">OpenChoreo cluster agents</text>
  <text x="568" y="367" class="lblc">(outbound WebSocket)</text>

  <!-- Legend -->
  <line x1="20" y1="566" x2="60" y2="566" class="flow"/>
  <text x="68" y="570" class="sub">request / provision</text>
  <line x1="200" y1="566" x2="240" y2="566" class="pull"/>
  <text x="248" y="570" class="sub">OCM: platform baseline and registration</text>
  <line x1="520" y1="566" x2="560" y2="566" class="agent"/>
  <text x="568" y="570" class="sub">OpenChoreo: application releases</text>
</svg>
